name: Pre-Build Release Automation

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Delete Existing Pre_Builds Release & Tag (If Present)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete Pre_Builds --yes || true
          git push --delete origin Pre_Builds || true

      - name: Create New Pre_Builds Release & Upload Signed APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          # Dynamically calculate exact APK sizes
          ARM64_SIZE=$(ls -lh app/build/outputs/apk/release/app-arm64-v8a-release.apk 2>/dev/null | awk '{print $5}' || echo "49M")
          ARMV7_SIZE=$(ls -lh app/build/outputs/apk/release/app-armeabi-v7a-release.apk 2>/dev/null | awk '{print $5}' || echo "31M")
          X86_64_SIZE=$(ls -lh app/build/outputs/apk/release/app-x86_64-release.apk 2>/dev/null | awk '{print $5}' || echo "52M")
          UNIV_SIZE=$(ls -lh app/build/outputs/apk/release/app-universal-release.apk 2>/dev/null | awk '{print $5}' || echo "90M")

          cat << EOF > release_notes.md
          ### 📦 Release Assets Guide

          | APK File | Architecture | Target Devices | Size |
          |---|---|---|---|
          | **app-arm64-v8a-release.apk** | **64-bit ARM** | **Recommended: 95%+ of modern Android phones** | **~${ARM64_SIZE}B** |
          | **app-armeabi-v7a-release.apk** | **32-bit ARM** | Older 32-bit Android devices | **~${ARMV7_SIZE}B** |
          | **app-x86_64-release.apk** | **64-bit x86** | Android Emulators, ChromeOS, PCs | **~${X86_64_SIZE}B** |
          | **app-universal-release.apk** | **Universal** | All devices (fallback all-in-one) | **~${UNIV_SIZE}B** |

          ---
          *Automated signed build generated on $BUILD_DATE from commit \`${{ github.sha }}\`.*
          EOF

          gh release create Pre_Builds app/build/outputs/apk/release/*.apk \
            --title "Pre_Builds ($SHORT_SHA)" \
            --notes-file release_notes.md \
            --prerelease

